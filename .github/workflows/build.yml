name: Build

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The disk tool (pure standard-library Python) builds the SASI image.
      - uses: actions/checkout@v4
        with:
          repository: ifilot/p2000c-cpm-disk-tool
          path: disktool

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check the rules (perft), the engine (self-play), FEN and QR codes natively
        run: |
          pip install zxing-cpp pillow
          make perft
          make selfplay
          make qrtest

      - name: Pull the Z88DK toolchain image
        run: docker pull z88dk/z88dk

      - name: Build SCHAKEN.COM
        run: make build

      - name: Build the SASI deployment image
        run: make deploy DISKTOOL=disktool

      - name: Package
        run: |
          mkdir -p release
          cp build/SCHAKEN.COM build/SCHAKEN.GFX build/HD1_256.hda LICENSE README.md CHANGELOG.md release/
          cd release && zip -9 ../p2000c-chess.zip SCHAKEN.COM SCHAKEN.GFX HD1_256.hda LICENSE README.md CHANGELOG.md
          sha256sum ../p2000c-chess.zip SCHAKEN.COM SCHAKEN.GFX HD1_256.hda

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: p2000c-chess
          path: |
            p2000c-chess.zip
            build/SCHAKEN.COM
            build/SCHAKEN.GFX
            build/HD1_256.hda
          retention-days: 90

  release:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: p2000c-chess
          path: dist

      # A tag pushed again (moved to another commit) replaces the files of
      # its existing release instead of failing to create it a second time.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          files="dist/p2000c-chess.zip dist/build/SCHAKEN.COM dist/build/SCHAKEN.GFX dist/build/HD1_256.hda"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" $files --clobber
          else
            gh release create "$GITHUB_REF_NAME" $files --title "Schaken $GITHUB_REF_NAME" --generate-notes
          fi
